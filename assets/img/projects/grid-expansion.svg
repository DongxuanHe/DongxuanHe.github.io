<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Grid expansion and phased data-center interconnection</title>
  <desc id="desc">A schematic transmission network connected to server racks, with three illustrative stages of admitted capacity. The diagram does not show measured results.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1d32"/><stop offset="1" stop-color="#173a48"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#a2d6e4" stroke-opacity=".075"/></pattern>
    <g id="rack"><rect width="86" height="210" rx="10" fill="#233f55" stroke="#93b9cf" stroke-width="3"/><g fill="#11283b" stroke="#557c96" stroke-width="2"><rect x="12" y="17" width="62" height="36" rx="5"/><rect x="12" y="65" width="62" height="36" rx="5"/><rect x="12" y="113" width="62" height="36" rx="5"/><rect x="12" y="161" width="62" height="30" rx="5"/></g><g fill="#79d6d2"><circle cx="25" cy="35" r="4"/><circle cx="25" cy="83" r="4"/><circle cx="25" cy="131" r="4"/><circle cx="25" cy="176" r="4"/></g><path d="M39 35H62M39 83H62M39 131H62M39 176H62" stroke="#93b9cf" stroke-width="3"/></g>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="64" y="74" fill="#9ec0d3" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">MULTI-YEAR INFRASTRUCTURE PLANNING</text>
  <g stroke="#638ca8" stroke-width="5" fill="none"><path d="m125 258 165-102 188 55 65 158-162 74-191-43-65-142 256 185-91-287 253 213"/><path d="m190 400 288-189"/></g>
  <path d="M478 211 648 280H763M543 369 648 280" fill="none" stroke="#e6b770" stroke-width="6"/>
  <path d="M543 369H692V402H807" fill="none" stroke="#79d6d2" stroke-width="4" stroke-dasharray="13 10"/>
  <g fill="#18384e" stroke="#a4c8dc" stroke-width="4"><circle cx="125" cy="258" r="13"/><circle cx="290" cy="156" r="13"/><circle cx="478" cy="211" r="13"/><circle cx="543" cy="369" r="13"/><circle cx="381" cy="443" r="13"/><circle cx="190" cy="400" r="13"/></g>
  <circle cx="648" cy="280" r="17" fill="#e6b770" stroke="#f4d49a" stroke-width="3"/>
  <g transform="translate(780 158)"><use href="#rack"/><use href="#rack" x="102"/><use href="#rack" x="204"/></g>
  <g font-family="Arial, sans-serif" font-size="24" fill="#d5e6ef"><text x="142" y="498">Transmission network</text><text x="850" y="410">Data center</text></g>
  <g transform="translate(780 463)"><path d="M0 83H290" stroke="#7598ac" stroke-width="2"/><rect x="13" y="53" width="64" height="30" rx="3" fill="#79d6d2" fill-opacity=".45"/><rect x="111" y="28" width="64" height="55" rx="3" fill="#79d6d2" fill-opacity=".7"/><rect x="209" width="64" height="83" rx="3" fill="#79d6d2"/><g fill="#9ec0d3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><text x="45" y="111">Year 1</text><text x="143" y="111">Year 2</text><text x="241" y="111">Year 3</text></g></g>
  <text x="64" y="566" fill="#79d6d2" font-family="Arial, sans-serif" font-size="22">Upgrade timing → phased admission</text>
  <path d="M64 600H1136" stroke="#92b5c8" stroke-opacity=".23"/>
  <text x="64" y="640" fill="#9ec0d3" font-family="Arial, sans-serif" font-size="20" letter-spacing="1">NETWORK CONSTRAINTS</text>
  <text x="1136" y="640" text-anchor="end" fill="#9ec0d3" font-family="Arial, sans-serif" font-size="20" letter-spacing="1">BUDGETS · CONSTRUCTION LEAD TIMES</text>
</svg>
