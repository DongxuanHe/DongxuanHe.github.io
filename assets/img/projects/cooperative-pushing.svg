<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Multi-robot cooperative pushing</title>
  <desc id="desc">A conceptual overhead view of two mobile robots pushing a rectangular object toward a dashed target pose.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1d32"/><stop offset="1" stop-color="#173a48"/></linearGradient>
    <linearGradient id="box" x2="1" y2="1"><stop stop-color="#e6b770"/><stop offset="1" stop-color="#b37b3e"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#a2d6e4" stroke-opacity=".075"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#79d6d2" stroke-width="1.5"/></marker>
    <g id="robot">
      <rect x="-50" y="-65" width="28" height="44" rx="9" fill="#071422"/>
      <rect x="-50" y="21" width="28" height="44" rx="9" fill="#071422"/>
      <rect x="22" y="-65" width="28" height="44" rx="9" fill="#071422"/>
      <rect x="22" y="21" width="28" height="44" rx="9" fill="#071422"/>
      <rect x="-58" y="-48" width="116" height="96" rx="26" fill="#c4dce6" stroke="#eefaff" stroke-width="3"/>
      <rect x="-39" y="-30" width="76" height="60" rx="16" fill="#80a8be"/>
      <circle r="21" fill="#163c52" stroke="#bfe9f3" stroke-width="4"/>
      <circle r="8" fill="#79d6d2"/>
      <rect x="45" y="-25" width="15" height="50" rx="6" fill="#53b8bb"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <g fill="#9ec0d3" font-family="Arial, sans-serif" font-size="22" letter-spacing="4"><text x="64" y="74">COOPERATIVE ROBOT LEARNING</text></g>
  <g transform="translate(820 344) rotate(-12)">
    <rect x="-102" y="-148" width="204" height="296" rx="16" fill="#79d6d2" fill-opacity=".045" stroke="#79d6d2" stroke-width="4" stroke-dasharray="14 11"/>
    <path d="M-22 0H22M0-22V22" stroke="#79d6d2" stroke-width="3"/>
  </g>
  <path d="M585 342C660 342 676 329 718 328" fill="none" stroke="#79d6d2" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <path d="m283 260 181-108v216Z M283 426 181-108v216Z" fill="#79d6d2" fill-opacity=".06" stroke="#79d6d2" stroke-opacity=".18" stroke-width="2"/>
  <rect x="408" y="195" width="180" height="312" rx="16" fill="#050f1c" opacity=".35"/>
  <rect x="396" y="180" width="180" height="312" rx="16" fill="url(#box)" stroke="#f4d49a" stroke-width="3"/>
  <path d="M422 204H550V468H422Z" fill="none" stroke="#724d2f" stroke-opacity=".3" stroke-width="2"/>
  <path d="M476 195H496V477H476Z" fill="#f2d5a1" fill-opacity=".32"/>
  <use href="#robot" transform="translate(295 254)"/>
  <use href="#robot" transform="translate(295 423)"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#d5e6ef">
    <text x="239" y="168">Robot 1</text><text x="239" y="535">Robot 2</text>
    <text x="744" y="565" fill="#79d6d2">Target pose</text>
  </g>
  <path d="M64 600H1136" stroke="#92b5c8" stroke-opacity=".23"/>
  <text x="64" y="640" fill="#9ec0d3" font-family="Arial, sans-serif" font-size="20" letter-spacing="1">LOCAL OBSERVATIONS</text>
  <text x="1136" y="640" text-anchor="end" fill="#9ec0d3" font-family="Arial, sans-serif" font-size="20" letter-spacing="1">SHARED POLICY · JOINT OBJECTIVE</text>
</svg>
